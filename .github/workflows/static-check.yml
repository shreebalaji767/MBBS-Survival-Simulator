name: Static checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check src/game.js
          node --check src/upgrade.js
          node --check service-worker.js
          node tests/smoke-test.js
      - name: Check required app files
        run: |
          test -f index.html
          test -f manifest.json
          test -f styles/main.css
          test -f styles/upgrade.css
          grep -q 'src/upgrade.js' index.html
          grep -q 'service-worker.js' src/upgrade.js
